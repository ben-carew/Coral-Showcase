; Coral against fiTQun on single-ring electrons.
;
;   sextant check   examples/electron_comparison.ini    # verify configs agree
;   sextant run     examples/electron_comparison.ini    # launch every arm
;   sextant status  examples/electron_comparison.ini    # progress
;   sextant report  examples/electron_comparison.ini    # collect + build the PDF

[experiment]
name       = e_comparison
production = v1.12.22
sample     = electron
events     = 1000
where      = server
hypothesis = e-
reference  = fitqun            ; the arm everything else is compared against
truth      = Output/Truth/truth_electron.root

[run]
events_per_job = 25

[shared]
; Concepts from sextant.config.mapping, translated into each code's own key.
; Calibration constants (QE, attenuation, scattered-light-in-charge) are NOT
; settable here -- they come as a set from each arm's `scheme`.
use_time_likelihood = true
do_electron_fit     = true
do_muon_fit         = true
bias_correction     = false

[arm.coral_sandbox]
algorithm = coral
slot      = a
branch    = ben/sandbox
scheme    = coral-production
label     = Coral ben/sandbox
; Native Coral settings, for things with no fiTQun counterpart.
config.fits.truth_seed = False

[arm.fitqun]
algorithm = fitqun
scheme    = fitqun-hk2024-wscat
label     = fiTQun HK-2024
params    = Software/fiTQun/ParameterOverrideFiles/Official_HyperK_2024_wscat_1Remu.parameters.dat
; The _1Remu variant runs the 1-ring e/mu fits only. The full
; Official_HyperK_2024_wscat file additionally runs the pi0, pi+, multi-ring and
; sequential multi-ring fits, which on this detector cost ~20 MINUTES PER EVENT
; -- measured, not estimated. Use the full file only when you actually want
; those fits, and size the wall time for them.
