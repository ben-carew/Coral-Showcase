; Smallest useful exercise of the beam path: NEUT events, stride-1000 event ids,
; the beam file-naming scheme, and the official fiTQun arm read off disk.
; Multi-ring is OFF -- with the ring-counting cut running, beam events take
; ~126 s each and this is a plumbing test, not a measurement.

[experiment]
name       = sextant_beam_smoke
production = beam-fhc
sample     = numu_x_numu
events     = 20
where      = server
hypothesis = e-
reference  = fitqun_official
truth      = Output/Truth/truth_beam_numu.root

[run]
events_per_job = 10

[shared]
use_time_likelihood = true
do_electron_fit     = true
do_muon_fit         = true

[arm.coral]
algorithm = coral
slot      = a
scheme    = coral-production
label     = Coral (beam)
config.fits.truth_seed        = False
config.multiring.do_multiring = false

[arm.fitqun_official]
algorithm = fitqun
source    = official
scheme    = fitqun-hk2024-wscat
label     = fiTQun 6.4.4 (official)
