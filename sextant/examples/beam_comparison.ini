; The neutrino-beam sample: NEUT interactions, multi-ring topologies, and the
; official fiTQun 6.4.4 reconstruction that ships with the production read
; straight off disk as a reference arm (no cluster time at all).

[experiment]
name       = beam_numu
production = beam-fhc
sample     = numu_x_numu
events     = 2000
where      = server
hypothesis = e-
reference  = fitqun_official
truth      = Output/Truth/truth_beam_numu.root      ; built by `sextant truth`

[run]
events_per_job = 10                ; beam events are busier than particle guns

[shared]
use_time_likelihood = true
do_electron_fit     = true
do_muon_fit         = true
do_multiring_fit    = true

[arm.coral_multiring]
algorithm = coral
slot      = a
branch    = multiring-fit
scheme    = coral-production
label     = Coral multi-ring
config.fits.truth_seed      = False
config.multiring.do_multiring = true

[arm.fitqun_official]
algorithm = fitqun
source    = official           ; read the production's own rfqn files
scheme    = fitqun-hk2024-wscat
label     = fiTQun 6.4.4 (official)
