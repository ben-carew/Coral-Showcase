; R39 (2026-10-20): learned light correction v4 (trained through the fit by implicit differentiation; smooth model), JAX + device simplex on V100, held-out events from file 540; base and jax arms read from r39_llc_e.
[experiment]
name        = r39_llc4_e
production  = v1.12.29
sample      = electron
events      = 2000
where       = server
hypothesis  = e-
reference   = base
truth       = Output/Truth/truth_electron_v1.12.29.root
pid_partner = Analysis/Experiments/r39_llc4_mu.ini

[run]
start          = 540
events_per_job = 100

[server]
time = 6:00:00
mem  = 12G

[shared]
use_time_likelihood = true
do_electron_fit     = true
do_muon_fit         = true

[arm.base]
algorithm = coral
source    = file
path      = Output/Coral/Reco/r39_llc_e/coral_electron_base.root
scheme    = coral-hitscat-2026-10
label     = Coral production (numba, CPU)

[arm.jax]
algorithm = coral
source    = file
path      = Output/Coral/Reco/r39_llc_e/coral_electron_jax.root
scheme    = coral-hitscat-2026-10
label     = JAX likelihood (V100 GPU)

[arm.jaxs]
algorithm = coral
slot      = b
branch    = ben/r39-jax
scheme    = coral-hitscat-2026-10
label     = JAX, smooth model, no correction (control) (V100 GPU)
config.in_out.dump_fit_stages = True
config.likelihood.backend = jax
config.likelihood.device_minimiser = True
config.likelihood.cprof_r0_interp = True
config.likelihood.angular_interp = True
server.partition = gpu_v100
server.gpus = 1
server.env = PYTHONPATH=/sps/hyperk/bcarew/Software/Dependencies/pyjax_cuda:/sps/hyperk/bcarew/Software/Dependencies/pyjax:$PYTHONPATH; XLA_PYTHON_CLIENT_PREALLOCATE=false; CORAL_JAX_CACHE_TAR=1

[arm.llc4]
algorithm = coral
slot      = b
branch    = ben/r39-jax
scheme    = coral-hitscat-2026-10
label     = JAX + learned light corrections v4 (V100 GPU)
config.in_out.dump_fit_stages = True
config.likelihood.backend = jax
config.likelihood.device_minimiser = True
config.likelihood.cprof_r0_interp = True
config.likelihood.angular_interp = True
config.tuning_files.light_corrections.e- = /sps/hyperk/bcarew/Output/Coral/Reco/r39_jax/llc4_e.npz
config.tuning_files.light_corrections.mu- = /sps/hyperk/bcarew/Output/Coral/Reco/r39_jax/llc4_mu.npz
server.partition = gpu_v100
server.gpus = 1
server.env = PYTHONPATH=/sps/hyperk/bcarew/Software/Dependencies/pyjax_cuda:/sps/hyperk/bcarew/Software/Dependencies/pyjax:$PYTHONPATH; XLA_PYTHON_CLIENT_PREALLOCATE=false; CORAL_JAX_CACHE_TAR=1
